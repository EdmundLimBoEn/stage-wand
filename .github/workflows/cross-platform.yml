name: Cross-platform

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun scripts/protocol-fixtures-check.ts

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: host/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test and build Linux host
        working-directory: host
        run: |
          go test ./...
          go build -o stagewand-host ./cmd/stagewand-host
      - name: Cross-compile Windows host
        working-directory: host
        run: GOOS=windows GOARCH=amd64 go build -o stagewand-host.exe ./cmd/stagewand-host
      - name: WebSocket smoke against Go host
        run: bun scripts/ws-smoke.ts --spawn-host

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Protocol tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :protocol:test :app:assembleDebug
