name: StageWand
options:
  bundleIdPrefix: systems.edmundlim
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DUU8J39BA7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    # Floor only. ios-testflight.yml passes a higher run-based build number.
    CURRENT_PROJECT_VERSION: "1"
targets:
  StageWand:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StageWand
      - ../Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.stagewand
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Stage Wand
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: systems.edmundlim.stagewand
            CFBundleURLSchemes: [stagewand]
        UILaunchScreen: {}
        UIBackgroundModes: [audio, bluetooth-central]
        NSLocalNetworkUsageDescription: Connect to your computer to control presentations and the pointer.
        NSBluetoothAlwaysUsageDescription: Connect directly to your computer over Bluetooth for low-latency pointer control.
        NSBonjourServices: [_stagewand._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
